<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | Gaza Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #f9f5ef 0%, #f4ece2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2d2017;
        }
        .error-container {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 32px;
            backdrop-filter: blur(8px);
            max-width: 500px;
            margin: 20px;
            box-shadow: 0 18px 40px rgba(65, 40, 20, 0.12);
            border: 1px solid rgba(106, 72, 41, 0.15);
        }
        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #9b5b31;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .error-text {
            color: #6b5a4c;
            margin-bottom: 32px;
            font-size: 18px;
        }
        .home-btn {
            display: inline-block;
            background: #9b5b31;
            color: white;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 14px;
            font-weight: 700;
            transition: 0.25s ease;
        }
        .home-btn:hover {
            background: #5f7d4c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">٤٠٤</div>
        <div class="error-title">الصفحة غير موجودة</div>
        <div class="error-text">عذراً، الصفحة التي تبحث عنها غير متوفرة أو تم نقلها.</div>
        <a href="/" class="home-btn">🏠 العودة إلى الرئيسية</a>
    </div>
</body>
</html>
